<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contingency Shop</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      nav a {
        margin-right: 1rem;
      }
      .catalog-preview {
        border: 1px solid #ccc;
        height: 12rem;
        margin-top: 1rem;
        overflow-y: auto;
        padding: 0.5rem;
      }
      .product {
        border-bottom: 1px solid #eee;
        padding: 0.75rem 0;
      }
      .product:hover {
        background: #f5f5f5;
      }
      .product button {
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Shop">
      <a href="/shop.html">Home</a>
      <a href="/catalog.html">Catalog</a>
      <a href="/cart.html">Cart</a>
    </nav>
    <main>
      <h1>Contingency Shop</h1>
      <p>A disposable ecommerce site for verification runs.</p>
      <form id="search-form">
        <label for="search">Search the catalogue</label>
        <input id="search" name="search" placeholder="anvil" type="search" />
      </form>
      <section aria-labelledby="sku-heading">
        <h2 id="sku-heading">Add by SKU</h2>
        <label for="sku">SKU</label>
        <input id="sku" name="sku" placeholder="ANVIL-001" type="text" />
        <button id="add-sku" type="button">Add SKU to cart</button>
      </section>
      <p id="cart-status">0 items in cart</p>
      <button id="view-cart" type="button">View cart</button>
      <section id="delivery" aria-labelledby="delivery-heading">
        <h2 id="delivery-heading">Delivery</h2>
        <button id="choose-delivery" type="button">Choose delivery area</button>
      </section>
      <section aria-labelledby="preview-heading" class="catalog-preview">
        <h2 id="preview-heading">Featured products</h2>
        <article class="product">
          <h3>Giant anvil</h3>
          <p>SKU ANVIL-001</p>
          <button class="add-product" data-sku="ANVIL-001" type="button">
            Add Giant anvil to cart
          </button>
        </article>
        <article class="product">
          <h3>Workbench</h3>
          <p>SKU BENCH-002</p>
          <button class="add-product" data-sku="BENCH-002" type="button">
            Add Workbench to cart
          </button>
        </article>
        <article class="product">
          <h3>Safety goggles</h3>
          <p>SKU SAFE-003</p>
          <button class="add-product" data-sku="SAFE-003" type="button">
            Add Safety goggles to cart
          </button>
        </article>
      </section>
    </main>
    <script>
      const storageKey = "contingency-shop-cart";
      const readCart = () => {
        try {
          return JSON.parse(sessionStorage.getItem(storageKey) ?? "[]");
        } catch {
          return [];
        }
      };
      const writeCart = (items) => {
        sessionStorage.setItem(storageKey, JSON.stringify(items));
        document.getElementById("cart-status").textContent =
          `${items.length} item${items.length === 1 ? "" : "s"} in cart`;
      };
      // Both add routes go through one function so the featured list and the
      // Add by SKU form leave the cart and the status paragraph identical.
      const addToCart = (sku) => {
        if (!sku) {
          return;
        }
        const cart = readCart();
        cart.push(sku);
        writeCart(cart);
        fetch("/cart-added").catch(() => {});
      };
      writeCart(readCart());
      document.getElementById("add-sku").addEventListener("click", () => {
        addToCart(document.getElementById("sku").value.trim());
      });
      for (const button of document.querySelectorAll(".add-product")) {
        button.addEventListener("click", () => {
          addToCart(button.dataset.sku);
        });
      }
      document.getElementById("view-cart").addEventListener("click", () => {
        window.location.assign("/cart.html");
      });
      // The delivery journey is the parameterized one: a Flow Skill learned
      // from it must be able to reach a different city and area than the
      // demonstration used, so both are typed rather than picked by position.
      const renderManualPicker = () => {
        document.getElementById("delivery").innerHTML = [
          "<h2>Delivery area</h2>",
          "<label for='city'>City</label>",
          "<input id='city' name='city' type='text' />",
          "<label for='area'>Search for your delivery area</label>",
          "<input id='area' name='area' type='text' />",
          "<button id='confirm-area' type='button'>Confirm delivery area</button>",
          "<p id='delivery-status' role='status'>No delivery area chosen</p>",
        ].join("");
        document
          .getElementById("confirm-area")
          .addEventListener("click", () => {
            const city = document.getElementById("city").value.trim();
            const area = document.getElementById("area").value.trim();
            document.getElementById("delivery-status").textContent =
              city && area
                ? `Delivering to ${area}, ${city}`
                : "Enter a city and a delivery area";
          });
      };
      const renderDeliveryChoice = () => {
        document.getElementById("delivery").innerHTML = [
          "<h2>Delivery area</h2>",
          "<button type='button'>Use current location</button>",
          "<button id='select-manually' type='button'>Select manually</button>",
        ].join("");
        document
          .getElementById("select-manually")
          .addEventListener("click", renderManualPicker);
      };
      document
        .getElementById("choose-delivery")
        .addEventListener("click", () => {
          history.pushState({}, "", "/shop.html/delivery");
          requestAnimationFrame(() => {
            setTimeout(() => {
              requestAnimationFrame(renderDeliveryChoice);
            }, 0);
          });
        });
    </script>
  </body>
</html>
