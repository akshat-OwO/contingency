<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contingency Shop sign in</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <label for="account">Account ID</label>
      <input id="account" name="account" type="text" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" />
      <fieldset>
        <legend>One-time code</legend>
        <input
          aria-label="otp-input 1 of 6"
          inputmode="numeric"
          maxlength="1"
        />
        <input
          aria-label="otp-input 2 of 6"
          inputmode="numeric"
          maxlength="1"
        />
        <input
          aria-label="otp-input 3 of 6"
          inputmode="numeric"
          maxlength="1"
        />
        <input
          aria-label="otp-input 4 of 6"
          inputmode="numeric"
          maxlength="1"
        />
        <input
          aria-label="otp-input 5 of 6"
          inputmode="numeric"
          maxlength="1"
        />
        <input
          aria-label="otp-input 6 of 6"
          inputmode="numeric"
          maxlength="1"
        />
      </fieldset>
      <p>Available in 1800+ cities.</p>
      <p>Drugs and Cosmetics Act, 1940.</p>
      <button type="button">Sign in</button>
      <output aria-live="polite" id="verification"></output>
    </main>
    <script>
      const otpInputs = [...document.querySelectorAll("fieldset input")];
      const verification = document.getElementById("verification");
      const update = () => {
        const otp = otpInputs.map((input) => input.value).join("");
        verification.textContent =
          otp.length === otpInputs.length ? "Verification ready" : "";
      };
      otpInputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          if (input.value.length > 1) {
            input.value = "";
          } else if (input.value.length === 1) {
            otpInputs[index + 1]?.focus();
          }
          update();
        });
      });
    </script>
  </body>
</html>
