<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <label for="token">Token</label>
      <input id="token" name="token" type="text" />
      <!--
        The page puts what was typed into visible text, which is what makes
        scrubbing testable: a diagnostic that reports the elements it found
        nearby would print this credential unless every string it produces is
        redacted first.
      -->
      <div id="echo" role="status">Signed in as</div>
    </main>
    <script>
      const echo = document.getElementById("echo");
      document.getElementById("token").addEventListener("input", (event) => {
        echo.textContent = `Signed in as ${event.target.value}`;
      });
    </script>
  </body>
</html>
