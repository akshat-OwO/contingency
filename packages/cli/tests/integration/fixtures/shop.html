<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Anvil Works</title>
  </head>
  <body>
    <main>
      <h1>Anvil Works</h1>
      <!--
        The shop under test: browsing types here, buying opens the cart in a
        second Page, and returning to the page leaves evidence the Run can be
        held to.
      -->
      <form>
        <label for="search">Search the catalogue</label>
        <!--
          A user-led Demonstration types without clicking first, so the field a
          demonstration starts in is focused at load.
        -->
        <input
          autofocus
          id="search"
          name="search"
          placeholder="e.g. anvil"
          type="text"
        />
      </form>
      <!--
        Fields kept out of the search form, which submits on Enter only while
        it holds a single text field. Each one names itself a different way,
        so a name taken from the wrong source is unmistakable.
      -->
      <div>
        <label for="sku">SKU</label>
        <input id="sku" name="sku" placeholder="ANV-0000" type="text" />
        <!-- A field named only by its placeholder still has a name. -->
        <input
          id="coupon"
          name="coupon"
          placeholder="Coupon code"
          type="text"
        />
        <!-- An aria-label outranks the placeholder. -->
        <input
          aria-label="Quantity"
          id="quantity"
          name="quantity"
          placeholder="1"
          type="text"
        />
      </div>
      <button id="add" type="button">Add giant anvil to cart</button>
      <!--
        The user clicks this one by coordinate, the way a pointer reaches it
        through the Workspace, so it is laid out at a fixed place.
      -->
      <button
        id="view-cart"
        style="
          height: 32px;
          left: 20px;
          position: fixed;
          top: 300px;
          width: 160px;
        "
        type="button"
      >
        View cart
      </button>
      <output id="cart-count">0 items</output>
    </main>
    <script>
      document.getElementById("add").addEventListener("click", () => {
        window.open("/cart.html", "_blank");
      });
      document.getElementById("view-cart").addEventListener("click", () => {
        document.getElementById("cart-count").textContent = "1 item";
        fetch("/cart-viewed").catch(() => {});
      });
    </script>
  </body>
</html>
