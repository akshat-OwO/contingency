<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popup</title>
  </head>
  <body>
    <main>
      <h1>Popup</h1>
      <!--
        Opens a second tab from a user action. A future Recording has to
        follow it rather than fail on it, and a test proves it followed by
        acting on the target page's own content.
      -->
      <button id="open-popup" type="button">Open checkout tab</button>
    </main>
    <script>
      const trigger = document.getElementById("open-popup");
      trigger.addEventListener("click", () => {
        // A deliberate gap between the click and the popup, so a recording
        // that covers the whole Run is decisively longer than one that only
        // covers the Pages opened after the click.
        setTimeout(() => {
          window.open("/popup-target.html", "_blank");
        }, 1500);
      });
    </script>
  </body>
</html>
