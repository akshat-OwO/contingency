<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Framed</title>
  </head>
  <body>
    <!--
      Loaded into an iframe from a different origin than its parent, so a
      recorder that only reaches the main frame records nothing here.
    -->
    <button id="framed" type="button">Subscribe</button>
  </body>
