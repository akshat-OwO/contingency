<!doctype html>
<!--
  Known accessibility violations, each mapped to the axe-core rule that
  flags it. Later tickets assert on Findings against these, so the set is
  deliberate and must not drift silently.

  - image-alt on every image: the many-elements rule. One rule, twelve
    Findings, so elision with a true count has something to elide.
  - label on the unlabelled input.
  - button-name on the empty button.
  - link-name on the empty link.
  - document-title: no title element at all.
-->
