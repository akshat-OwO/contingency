<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Variable opaque sheet</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <label for="mobile">Mobile number</label>
      <input id="mobile" type="tel" />
    </main>
    <div style="position: fixed; inset: 0; background: white">
      <div style="position: absolute; inset: 0"></div>
    </div>
  </body>
</html>
