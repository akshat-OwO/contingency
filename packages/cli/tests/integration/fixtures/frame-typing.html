<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Embedded payment</title>
    <style>
      body {
        margin: 0;
      }
      iframe {
        position: absolute;
        left: 20px;
        top: 20px;
        width: 280px;
        height: 60px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="payment" title="Secure payment"></iframe>
    <script>
      // A different host from the page's, so the field renders in its own
      // process, as a payment provider's does.
      document.getElementById("payment").src =
        `http://localhost:${location.port}/web-matrix-frame.html?field=Card%20number`;
    </script>
  </body>
</html>
