<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <label for="username">Username</label>
      <!-- A user-led Demonstration types before it clicks anything. -->
      <input autofocus id="username" name="username" type="text" />
      <label for="password">Password</label>
      <!-- Clicked by coordinate during a user-led Demonstration. -->
      <input
        id="password"
        name="password"
        style="
          height: 24px;
          left: 200px;
          position: fixed;
          top: 140px;
          width: 160px;
        "
        type="password"
      />
    </main>
  </body>
</html>
