<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Busy</title>
  </head>
  <body>
    <main>
      <h1>Busy</h1>
      <!--
        Goes busy after navigation has had time to reach network idle, then
        keeps fetching and mutating the DOM on a timer. This isolates the
        final quiescence bound from the navigation-idle contract.
      -->
      <p id="tick-count">0</p>
      <ul id="ticks"></ul>
    </main>
    <script>
      const count = document.getElementById("tick-count");
      const list = document.getElementById("ticks");
      let ticks = 0;
      const tick = () => {
        ticks += 1;
        count.textContent = String(ticks);
        // The list stays bounded so a long-lived page cannot grow memory
        // without limit; the counter above carries the true total.
        const entry = document.createElement("li");
        entry.textContent = `Tick ${ticks}`;
        list.prepend(entry);
        while (list.children.length > 10) {
          list.lastChild?.remove();
        }
        fetch("/busy-tick-beacon").catch(() => {});
      };
      let timer;
      const start = setTimeout(() => {
        tick();
        timer = setInterval(tick, 100);
      }, 700);
      window.addEventListener("pagehide", () => {
        clearTimeout(start);
        clearInterval(timer);
      });
    </script>
  </body>
</html>
