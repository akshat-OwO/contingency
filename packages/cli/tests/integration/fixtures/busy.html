<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Busy</title>
  </head>
  <body>
    <main>
      <h1>Busy</h1>
      <!--
        Never goes quiet: after load it keeps fetching and mutating the DOM
        on a timer, with no interaction required, so a Run that tears down
        early is observable — the last tick's beacon is missing from the
        server's request log and the log's length lags the tick counter.
      -->
      <p id="tick-count">0</p>
      <ul id="ticks"></ul>
    </main>
    <script>
      const count = document.getElementById("tick-count");
      const list = document.getElementById("ticks");
      let ticks = 0;
      const tick = () => {
        ticks += 1;
        count.textContent = String(ticks);
        // The list stays bounded so a long-lived page cannot grow memory
        // without limit; the counter above carries the true total.
        const entry = document.createElement("li");
        entry.textContent = `Tick ${ticks}`;
        list.prepend(entry);
        while (list.children.length > 10) {
          list.lastChild?.remove();
        }
        fetch("/busy-tick-beacon").catch(() => {});
      };
      // First tick fires on load rather than after the first interval: a Run
      // that tears down immediately still leaves one beacon behind, which is
      // what makes early teardown observable rather than merely likely.
      tick();
      const timer = setInterval(tick, 100);
      window.addEventListener("pagehide", () => clearInterval(timer));
    </script>
  </body>
</html>
