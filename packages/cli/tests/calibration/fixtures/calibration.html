<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video overhead calibration</title>
    <style>
      body {
        font:
          16px system-ui,
          sans-serif;
        margin: 0;
      }
      /* Small on purpose. The largest paint must be the heading below, which
         is present in the markup and therefore paints identically whether or
         not a capture is forcing the browser to produce frames. */
      #hero {
        display: block;
        height: 36px;
        width: 64px;
      }
      /* The LCP element: laid out large, above the fold, and in the markup, so
         it is the largest contentful paint on the page's very first frame. */
      #headline {
        font-size: 96px;
        line-height: 1.1;
        margin: 0 0 24px;
      }
      main {
        margin: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <!--
        The only subresource. The delay is server-side, so both conditions
        wait for it identically.
      -->
      <!--
        The LCP element. Text in the markup, so both conditions paint it on the
        first frame and the metric compares like with like.
      -->
      <h1 id="headline">Video overhead calibration</h1>
      <!--
        The marker: the experiment's server answers it after a fixed delay, so
        a Run that fetched it really loaded this page rather than a warm cache.
        Small on purpose — an image big enough to win LCP made the metric
        depend on whether a capture was forcing frames.
      -->
      <img id="hero" alt="" src="/hero.png" width="64" height="36" />
      <!--
        The INP interaction: ~120ms of synchronous work per click, well above
        the event API's 16ms reporting floor and identical on every run, so a
        difference between conditions is the machine, not the page. The Flow
        clicks this exactly once.
      -->
      <button id="block" type="button">Block the main thread</button>
    </main>
    <script>
      document.getElementById("block").addEventListener("click", () => {
        const until = performance.now() + 120;
        while (performance.now() < until) {}
      });
    </script>
  </body>
</html>
