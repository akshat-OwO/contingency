# Publishes @contingencyhq/cli to npm.
#
# The version is the only input. `v1.2.3` goes to the `latest` dist-tag;
# any prerelease tag goes to a dist-tag named after its identifier, so
# `v0.2.0-alpha.4` publishes to `alpha` and nothing else has to be
# configured to open a new channel. There is no schedule: a release happens
# because someone tagged one.
#
# Versions are never committed. `main` carries a placeholder, and the tag is
# stamped into the manifest at build time, so no pull request ever has to be
# rebased over a version bump.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.2.3 or 0.2.0-alpha.4"
        required: true
        type: string
      dry_run:
        description: "Build and pack, but publish nothing"
        required: false
        default: true
        type: boolean

# Releases are never cancelled mid-publish: a run killed between `npm publish`
# and the GitHub Release leaves a version on the registry with no tag behind
# it. Queued runs wait instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-framebuffer:
    name: Build universal iOS framebuffer helper
    needs: [preflight]
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: nubjs/setup-nub@v0
      - run: nub ci
      - name: Build and verify helper
        working-directory: packages/cli
        env:
          CONTINGENCY_BUILD_IOS_FRAMEBUFFER: "1"
        run: |
          nub src/packaging/build-ios-framebuffer.ts
          lipo -info dist/ios/framebuffer/framebuffer
          lipo dist/ios/framebuffer/framebuffer -verify_arch arm64
          lipo dist/ios/framebuffer/framebuffer -verify_arch x86_64
          codesign -v --strict --all-architectures dist/ios/framebuffer/framebuffer
      - uses: actions/upload-artifact@v4
        with:
          name: ios-framebuffer
          path: packages/cli/dist/ios/framebuffer/
          if-no-files-found: error

  preflight:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
      name: ${{ steps.release.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: nubjs/setup-nub@v0

      - run: nub ci

      # Rejects anything that is not a semantic version before a build runs,
      # so a typo in a tag fails in seconds rather than after the matrix.
      - id: release
        name: Resolve version, dist-tag, and release flags
        run: |
          node packages/release/src/main.ts resolve \
            "${{ inputs.version || github.ref_name }}"

      - name: Refuse to republish an existing version
        run: |
          version="${{ steps.release.outputs.version }}"
          if npm view "@contingencyhq/cli@${version}" version >/dev/null 2>&1; then
            echo "::error::@contingencyhq/cli@${version} is already on npm. Versions are immutable; tag a new one."
            exit 1
          fi
          echo "@contingencyhq/cli@${version} is unpublished. Proceeding."

  # The same gate CI runs, against the exact commit being published. A release
  # tag can point at any commit, including one that never passed a pull
  # request, so this is not redundant with the CI workflow.
  quality:
    name: Quality, types, and unit tests
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nubjs/setup-nub@v0

      - run: nub ci

      - run: nub exec turbo run quality check-types test

  integration:
    name: Integration (real browser)
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: nubjs/setup-nub@v0

      - run: nub ci

      - name: Install Chromium
        run: nub exec --cwd packages/cli playwright-core install chromium

      # Skip apt-get update: the runner's cached Ubuntu index is enough for
      # ffmpeg, and update also refreshes Google's Chrome repo, which has
      # intermittently failed with hash-sum mismatches and blocked release.
      - name: Install ffmpeg (ffprobe for the video assertions)
        run: sudo apt-get install -y ffmpeg

      - run: nub exec turbo run test:integration

  publish:
    name: Publish to npm
    needs: [preflight, quality, integration, ios-framebuffer]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # The OIDC token npm exchanges for short-lived publish credentials.
      # Without this the trusted publisher cannot authenticate and there is no
      # long-lived token to fall back on.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: nubjs/setup-nub@v0
        with:
          registry-url: https://registry.npmjs.org

      - run: nub ci

      - name: Build and verify the release artifact
        id: artifact
        uses: ./.github/actions/verify-cli-artifact
        with:
          version: ${{ needs.preflight.outputs.version }}

      # Authentication is the OIDC exchange configured as npm's trusted
      # publisher for this package: no NPM_TOKEN exists to leak or rotate.
      # Provenance is attested automatically under trusted publishing, so
      # passing --provenance here would be redundant.
      #
      # `--ignore-scripts` keeps `prepack` from rebuilding what the steps
      # above already built and verified.
      - name: Publish
        if: ${{ inputs.dry_run != true }}
        working-directory: packages/cli
        run: |
          npm publish "${{ steps.artifact.outputs.tarball }}" \
            --access public \
            --ignore-scripts \
            --tag "${{ needs.preflight.outputs.dist_tag }}"

      # A manual dispatch releases a version that may have no tag behind it.
      # Creating one keeps every published version reachable from git.
      - name: Create the release tag if the dispatch did not push one
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Publish the GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_start_tag=""
          if [ "${{ needs.preflight.outputs.is_prerelease }}" = "false" ]; then
            prev_stable="$(gh release list \
              --exclude-pre-releases \
              --limit 1 \
              --json tagName \
              -q '.[0].tagName' || true)"
            if [ -n "${prev_stable}" ]; then
              notes_start_tag="--notes-start-tag ${prev_stable}"
              echo "Generating notes from previous stable release ${prev_stable}."
            else
              echo "No previous stable release; using GitHub's default baseline."
            fi
          fi

          gh release create "${{ needs.preflight.outputs.tag }}" \
            --title "${{ needs.preflight.outputs.name }}" \
            --generate-notes \
            ${notes_start_tag} \
            --prerelease=${{ needs.preflight.outputs.is_prerelease }} \
            --latest=${{ needs.preflight.outputs.make_latest }} \
            "${{ steps.artifact.outputs.tarball }}"
