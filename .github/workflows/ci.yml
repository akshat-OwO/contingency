# The gate. Lint, formatting, types, and tests, on every PR and every push to
# main. Nothing else in this repo runs the test suites: the other checks
# (GitGuardian and Macroscope) read the diff, not the code running.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

# One run per PR (or branch, on push). A superseded commit's run is cancelled
# rather than left to finish against code nobody will merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs Nub, provisions the Node in .node-version, and caches the store.
      - uses: nubjs/setup-nub@v0

      - run: nub ci

      # One Turbo invocation, so a failure in any task still lets the others
      # report. `test` depends on `^build`, which builds the web bundle into
      # the CLI's dist — the same artifact a release ships.
      - run: nub exec turbo run quality check-types test

  # Integration runs alongside quality rather than after it, so a green PR
  # waits for the slower job only once. When quality fails, the PR cannot
  # merge anyway, so this cancels the run instead of letting integration
  # spend another twenty minutes. It is its own job so quality still reports
  # as failed; this job and integration report as cancelled. Fork PRs get a
  # read-only token that cannot cancel, so the job skips them rather than
  # adding a second red check.
  cancel-on-quality-failure:
    name: Cancel run after quality failure
    needs: [quality]
    if: ${{ failure() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  integration:
    name: Integration (real browser, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # The suite launches a real Chromium per test file and runs its files one
    # at a time, so it is split across runners by file. Every shard reports,
    # so one failing shard still shows the others' results.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: nubjs/setup-nub@v0

      - run: nub ci

      # The Runner drives Chromium through playwright-core, which resolves the
      # browser from the standard cache. Without a browser every test fails,
      # and a pinned build keeps Runs comparable across CI runs.
      - name: Install Chromium
        run: nub exec --cwd packages/cli playwright-core install chromium

      # The video integration test decodes the WebM it captured with ffprobe;
      # without it the test skips itself, and a skipped test proves nothing
      # about the feature it names. The runner no longer encodes with ffmpeg,
      # but the probe stays a hard prerequisite of this job.
      # Skip apt-get update: the runner's cached Ubuntu index is enough for
      # ffmpeg, and update also refreshes Google's Chrome repo, which has
      # intermittently failed with hash-sum mismatches and blocked CI.
      - name: Install ffmpeg (ffprobe for the video assertions)
        run: sudo apt-get install -y ffmpeg

      - name: Check ffprobe is present
        run: ffprobe -version

      - run: nub exec turbo run test:integration -- --shard=${{ matrix.shard }}/3

  # A test that passes once can still be a coin flip on a CI runner. Every test
  # file a PR adds or changes runs five times here, on the same runner class
  # as the gate, and one failure fails the PR. See docs/agents/testing.md.
  repeat-changed-tests:
    name: Repeat changed tests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find changed test files
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Paths come out relative to each package, ready for its Vitest.
        run: |
          list() {
            git -C "$1" diff --relative --name-only --diff-filter=AMR \
              "$BASE"...HEAD -- "${@:2}" | tr '\n' ' '
          }
          {
            echo "cli=$(list packages/cli ':(glob)tests/**/*.test.ts' ':(exclude)tests/integration/**')"
            echo "integration=$(list packages/cli ':(glob)tests/integration/*.test.ts')"
            echo "web=$(list apps/web ':(glob)**/*.test.ts' ':(glob)**/*.test.tsx')"
            echo "release=$(list packages/release ':(glob)tests/**/*.test.ts')"
          } > "$RUNNER_TEMP/changed-tests"
          if [ -n "$(cut -d= -f2- "$RUNNER_TEMP/changed-tests" | tr -d ' \n')" ]; then
            echo "any=true" >> "$RUNNER_TEMP/changed-tests"
          fi
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/changed-tests"

      - uses: nubjs/setup-nub@v0
        if: ${{ steps.changed.outputs.any == 'true' }}

      - if: ${{ steps.changed.outputs.any == 'true' }}
        run: nub ci

      - if: ${{ steps.changed.outputs.any == 'true' }}
        run: nub exec turbo run build

      - name: Install Chromium and ffmpeg
        if: ${{ steps.changed.outputs.integration != '' }}
        run: |
          nub exec --cwd packages/cli playwright-core install chromium
          sudo apt-get install -y ffmpeg

      - name: Repeat CLI unit tests
        if: ${{ steps.changed.outputs.cli != '' }}
        working-directory: packages/cli
        run: nub exec vitest run --repeats 4 ${{ steps.changed.outputs.cli }}

      - name: Repeat CLI integration tests
        if: ${{ steps.changed.outputs.integration != '' }}
        working-directory: packages/cli
        run: nub exec vitest run --config vitest.integration.config.ts --repeats 4 ${{ steps.changed.outputs.integration }}

      - name: Repeat web tests
        if: ${{ steps.changed.outputs.web != '' }}
        working-directory: apps/web
        run: nub exec vitest run --repeats 4 ${{ steps.changed.outputs.web }}

      - name: Repeat release tests
        if: ${{ steps.changed.outputs.release != '' }}
        working-directory: packages/release
        run: nub exec vitest run --repeats 4 ${{ steps.changed.outputs.release }}
