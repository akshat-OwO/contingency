# The gate. Lint, formatting, types, and tests, on every PR and every push to
# main. Nothing else in this repo runs the test suites: the other checks
# (GitGuardian and Macroscope) read the diff, not the code running.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

# One run per PR (or branch, on push). A superseded commit's run is cancelled
# rather than left to finish against code nobody will merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-framebuffer:
    name: Build universal iOS framebuffer helper
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: nubjs/setup-nub@v0
      - run: nub ci
      - name: Build and verify helper
        working-directory: packages/cli
        env:
          CONTINGENCY_BUILD_IOS_FRAMEBUFFER: "1"
        run: |
          nub src/packaging/build-ios-framebuffer.ts
          lipo -info dist/ios/framebuffer/framebuffer
          lipo dist/ios/framebuffer/framebuffer -verify_arch arm64
          lipo dist/ios/framebuffer/framebuffer -verify_arch x86_64
          codesign -v --strict --all-architectures dist/ios/framebuffer/framebuffer
      - uses: actions/upload-artifact@v4
        with:
          name: ios-framebuffer
          path: packages/cli/dist/ios/framebuffer/
          if-no-files-found: error

  quality:
    name: Quality, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs Nub, provisions the Node in .node-version, and caches the store.
      - uses: nubjs/setup-nub@v0

      - run: nub ci

      # One Turbo invocation, so a failure in any task still lets the others
      # report. `test` depends on `^build`, which builds the web bundle into
      # the CLI's dist — the same artifact a release ships.
      - run: nub exec turbo run quality check-types test

  release-artifact:
    name: Verify release artifact
    needs: [ios-framebuffer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: nubjs/setup-nub@v0
        with:
          registry-url: https://registry.npmjs.org
      - run: nub ci
      - uses: ./.github/actions/verify-cli-artifact
        with:
          version: 0.0.0-ci

  # No existing path-filter convention: run this proof on every PR and main push.
  ios-clean-host:
    name: Clean-host iOS helper (${{ matrix.architecture }})
    needs: [release-artifact]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          # Current standard Intel image; macos-13 has been retired.
          - runner: macos-26-intel
            architecture: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: nubjs/setup-nub@v0
      - run: nub ci
      - uses: actions/download-artifact@v5
        with:
          name: cli-release-tarball
          path: packed-cli
      - name: Verify installed helper on a clean Mac
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          tarballs=("$GITHUB_WORKSPACE"/packed-cli/*.tgz)
          test "${#tarballs[@]}" -eq 1
          nub packages/release/src/main.ts verify-ios-helper "${tarballs[0]}" --architecture "$EXPECTED_ARCHITECTURE"

  # Integration runs alongside quality rather than after it, so a green PR
  # waits for the slower job only once. When quality fails, the PR cannot
  # merge anyway, so this cancels the run instead of letting integration
  # spend another twenty minutes. It is its own job so quality still reports
  # as failed; this job and integration report as cancelled. Fork PRs get a
  # read-only token that cannot cancel, so the job skips them rather than
  # adding a second red check.
  cancel-on-quality-failure:
    name: Cancel run after quality failure
    needs: [quality]
    if: ${{ failure() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  integration:
    name: Integration (real browser, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Each runner runs two isolated browser-owning file workers. Keep three
    # shards to spread the longest files across runners. Every shard reports,
    # so one failing shard still shows the others' results.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: nubjs/setup-nub@v0

      - run: nub ci

      # The Runner drives Chromium through playwright-core, which resolves the
      # browser from the standard cache. Without a browser every test fails,
      # and a pinned build keeps Runs comparable across CI runs.
      - name: Install Chromium
        run: nub exec --cwd packages/cli playwright-core install chromium

      # The video integration test decodes the WebM it captured with ffprobe;
      # without it the test skips itself, and a skipped test proves nothing
      # about the feature it names. The runner no longer encodes with ffmpeg,
      # but the probe stays a hard prerequisite of this job.
      - name: Install ffmpeg (ffprobe for the video assertions)
        uses: ./.github/actions/install-ffmpeg

      - name: Check ffprobe is present
        run: ffprobe -version

      - run: nub exec turbo run test:integration -- --shard=${{ matrix.shard }}/3
